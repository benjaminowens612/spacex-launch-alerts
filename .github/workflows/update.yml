name: Update launches

on:
  schedule:
    - cron: '*/15 * * * *' # LL2 free tier: 15 req/h; each run uses 2
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/data/**', 'docs/cal/**']

permissions:
  contents: write # commit changed data (also keeps the schedule from going idle)
  pages: write
  id-token: write

concurrency:
  group: update-launches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always build on the tip of main, even when re-running an older run,
      # so the data commit below never conflicts with a newer one.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm test

      - name: Fetch launches and build calendars
        run: npm run build

      - name: Commit data if launches changed
        run: |
          git add -A docs/data docs/cal
          # Ignore the generatedAt timestamp so we only commit real changes.
          if git diff --cached --quiet -I '"generatedAt":'; then
            echo "No launch changes."
          else
            git config user.name "launch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Update launch data"
            # Data files are fully regenerated, so on a race keep this run's copy.
            for i in 1 2 3; do
              if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "::warning::Could not push data commit; the site is still deployed below."
          fi

      # Keeps the free Supabase project (push notifications) from pausing for inactivity.
      - name: Ping notifications backend
        run: curl -fsS --max-time 20 "https://dzlbxtbdymrusxzdroya.supabase.co/functions/v1/subscribe?ping" || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
